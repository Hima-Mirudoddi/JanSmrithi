{% extends "base.html" %}

{% block main %}
<div class="auth-page-bg">
    <div class="auth-box">
        <div class="auth-tabs">
            <a href="{{ url_for('login') }}" class="auth-tab active">Login</a>
            <a href="{{ url_for('register') }}" class="auth-tab">Register</a>
        </div>
        <div class="auth-content">
            <h2 class="text-center mb-4" style="font-weight: 700; font-size: 1.8rem;">Welcome Back</h2>
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username_email" style="font-weight: 600;">Username or Email</label>
                    <div class="input-icon-wrapper">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <input type="text" id="username_email" name="username_email" class="form-control with-icon"
                            placeholder="Enter username or email" required>
                    </div>
                </div>

                <div class="form-group mt-4">
                    <div class="flex-between mb-2">
                        <label for="password" style="font-weight: 600; margin-bottom: 0;">Password</label>
                        <a href="{{ url_for('forgot_password') }}" style="font-size: 0.85rem; color: #2563eb; font-weight: 500;">Forgot Password?</a>
                    </div>
                    <div class="input-icon-wrapper">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input type="password" id="password" name="password" class="form-control with-icon"
                            placeholder="Enter password" required>
                        <div class="password-toggle" onclick="togglePassword('password', this)">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn mt-4">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_head %}
<style>
    body { padding-bottom: 30px; }
</style>
{% endblock %}

{% block footer %}{% endblock %}

{% block extra_js %}
<script>
    function togglePassword(inputId, iconDiv) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            iconDiv.innerHTML = '<svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>';
        } else {
            input.type = "password";
            iconDiv.innerHTML = '<svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>';
        }
    }
</script>
{% endblock %}
