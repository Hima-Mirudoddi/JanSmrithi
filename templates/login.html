{% extends "base.html" %}

{% block main %}
<div class="card" style="max-width: 400px; margin: 40px auto; padding: 40px 30px;">
    <h2 class="text-center mb-4" style="font-weight: 600;">Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username_email">Username or Email</label>
            <input type="text" id="username_email" name="username_email" class="form-control" placeholder="Enter username or email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        
        <button type="submit" class="btn mt-4">Login</button>
    </form>
    
    <div class="text-center mt-4" style="font-size: 0.9rem;">
        <span class="text-secondary">Don't have an account? </span>
        <a href="{{ url_for('register') }}" style="color: var(--text-primary); font-weight: 500;">Create one</a>
    </div>
</div>
{% endblock %}
