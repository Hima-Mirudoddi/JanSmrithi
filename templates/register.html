{% extends "base.html" %}

{% block main %}
<div class="card" style="max-width: 400px; margin: 40px auto; padding: 40px 30px;">
    <h2 class="text-center mb-4" style="font-weight: 600;">Register</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
            <label for="mobile_number">Mobile Number</label>
            <input type="tel" id="mobile_number" name="mobile_number" class="form-control" placeholder="Enter mobile number" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
        </div>
        
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm your password" required>
        </div>
        
        <button type="submit" class="btn mt-4">Register</button>
    </form>
    
    <div class="text-center mt-4" style="font-size: 0.9rem;">
        <span class="text-secondary">Already have an account? </span>
        <a href="{{ url_for('login') }}" style="color: var(--text-primary); font-weight: 500;">Login</a>
    </div>
</div>
{% endblock %}
