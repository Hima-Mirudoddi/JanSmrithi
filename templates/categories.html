{% extends "base.html" %}

{% block main %}
<div class="card text-center mb-4 text-primary p-4">
    <h2>Categories</h2>
    <p class="text-secondary mt-2">Select a category to upload your cultural preservation</p>
</div>

<div class="categories-grid">
    {% for cat in categories %}
    <a href="{{ url_for('explore', category_name=cat.name) }}" class="category-card">
        <span class="category-icon">{{ cat.icon }}</span>
        <span class="category-name">{{ cat.name }}</span>
    </a>
    {% endfor %}
</div>
{% endblock %}

{% block extra_head %}
<style>
    .categories-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
    }
    
    .category-card {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 20px 10px;
        text-align: center;
        color: var(--text-primary);
        transition: transform 0.2s, box-shadow 0.2s;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 110px;
    }
    
    .category-icon {
        font-size: 32px;
        margin-bottom: 10px;
        transition: transform 0.3s ease;
    }
    
    .category-name {
        font-weight: 500;
        font-size: 0.9rem;
    }
    
    .category-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-sm);
        border-color: #ddd;
    }
    
    .category-card:hover .category-icon {
        opacity: 1;
    }
</style>
{% endblock %}
