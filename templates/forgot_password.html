{% extends "base.html" %}

{% block main %}
<div class="auth-page-bg">
    <div class="auth-box">
        <div class="auth-tabs">
            <a href="{{ url_for('login') }}" class="auth-tab">Back to Login</a>
        </div>
        <div class="auth-content">
            <h2 class="text-center mb-4" style="font-weight: 700; font-size: 1.8rem;">Reset Password</h2>
            <p class="text-center mb-4" style="color: var(--text-secondary); font-size: 0.9rem;">
                Enter your registered email and mobile number to securely verify your identity and set a new password.
            </p>
            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="form-group">
                    <label for="email" style="font-weight: 600;">Email Address</label>
                    <div class="input-icon-wrapper">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <input type="email" id="email" name="email" class="form-control with-icon" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="mobile_number" style="font-weight: 600;">Mobile Number</label>
                    <div class="input-icon-wrapper">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                        <input type="tel" id="mobile_number" name="mobile_number" class="form-control with-icon" placeholder="Registered mobile number" required pattern="[0-9]{10,15}">
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="new_password" style="font-weight: 600;">New Password</label>
                    <div class="input-icon-wrapper">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input type="password" id="new_password" name="new_password" class="form-control with-icon" placeholder="Min 8 chars, 1 num, 1 spec" required minlength="8">
                    </div>
                </div>

                <button type="submit" class="btn mt-4">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_head %}
<style>
    body { padding-bottom: 30px; }
</style>
{% endblock %}

{% block footer %}{% endblock %}
